services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pickup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pickup_dev_password}
      POSTGRES_DB: pickup_counter
    volumes:
      - pickup_counter_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickup -d pickup_counter"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ./server
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://pickup:${POSTGRES_PASSWORD:-pickup_dev_password}@db:5432/pickup_counter
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-local-development-only-secret-32-bytes-min}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://[::1]:3000
      API_BASE_URL: http://localhost:4000
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "node dist/scripts/migrate.js && node dist/scripts/seed.js && node dist/src/server.js"]
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  client:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - ./client:/workspace:ro
      - client_node_modules:/workspace/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3000:3000"

  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: pickup
      POSTGRES_PASSWORD: pickup_test_password
      POSTGRES_DB: pickup_counter_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickup -d pickup_counter_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pickup_counter_data:
  client_node_modules:
